providers = ["node"]

[phases.setup]
# nixpacks' default nixpkgs snapshot ships Node 22.19, which bundles a Brotli
# decoder vulnerable to CVE-2026-111497. Pin the nixos-26.05 channel (cached
# on cache.nixos.org, so Node isn't built from source): Node 22.23.4. pnpm_10
# is nixpkgs' own pnpm 10 (plain pnpm there is 11); it switches to the
# packageManager version.
nixPkgs = ["nodejs_22", "pnpm_10"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "node packages/server/dist/index.js"

[variables]
NODE_ENV = "production"
CLIENT_DIST = "/app/packages/client/dist"
