providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-10_x"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "node packages/server/dist/index.js"

[variables]
NODE_ENV = "production"
CLIENT_DIST = "/app/packages/client/dist"
